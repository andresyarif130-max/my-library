<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>📚 My Library</h1>
        <button id="newBookBtn">
           + New Book 
        </button>
    </header>

    <main>
        <section class="hero">
            <h2>My Bookshelf</h2>

            <p>
                Keep track of the books you want to read.
            </p>
        </section>

        <section class="book-form-section">
            <form id="bookForm">

                <input type="text" id="titleInput" placeholder="Book title">

                <input type="text" id="authorInput" placeholder="Author">
                
                <input type="number" id="pagesInput" placeholder="Number of pages">

                <label>
                    <input type="checkbox" id="readInput">
                    I have read this book
                </label>

                <button type="submit">
                    Add Book
                </button>

            </form>
        </section>

        <section>
            <div id="bookGrid">
                <!-- JavaScript will add books here -->
            </div>
        </section>
        <!-- <div class="book-card">
            <h3>The Hobbit</h3>
            <p>J.R.R. Tolkien</p>
            <p>295 pages</p>
        </div> -->
    </main>
</body>
</html>
